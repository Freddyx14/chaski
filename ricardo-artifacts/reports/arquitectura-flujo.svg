<text x="812" y="337.0" font-size="11.0" fill="#4E4D45" font-weight="700">La guarda</text>
<text x="812" y="368.9" font-size="11.0" fill="#4E4D45">Retraduce a ciegas y compara los</text>
<text x="812" y="384.9" font-size="11.0" fill="#4E4D45">hechos</text>
<text x="812" y="400.8" font-size="11.0" fill="#4E4D45">Si cambió una dosis, no se dice</text>
<text x="812" y="416.8" font-size="11.0" fill="#4E4D45">Medido: 0/6 falsos bloqueos, 3/6</text>
<text x="812" y="432.7" font-size="11.0" fill="#4E4D45">fugas</text>
