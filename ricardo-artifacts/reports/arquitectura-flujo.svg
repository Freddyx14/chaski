<text x="40" y="46.8" font-size="19.0" fill="#16160F" font-weight="700">Un turno de consulta, de micrófono a parlante</text>
<text x="40" y="66.8" font-size="12.0" fill="#4E4D45">Tiempos medidos el 24-oct-2026 en la A10G. Azul: Meta, en nuestra GPU, lo ajustamos. Verde: Cartesia. Rojo: Claude.</text>
