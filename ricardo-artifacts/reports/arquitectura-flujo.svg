<text x="1382" y="187.0" font-size="11.0" fill="#4E4D45" font-weight="700">Parlante</text>
<text x="1382" y="218.9" font-size="11.0" fill="#4E4D45">Texto primero, audio</text>
<text x="1382" y="234.8" font-size="11.0" fill="#4E4D45">después:</text>
<text x="1382" y="250.8" font-size="11.0" fill="#4E4D45">se lee antes de que termine</text>
<text x="1382" y="266.8" font-size="11.0" fill="#4E4D45">de hablar</text>
<rect x="40" y="480" width="1250" height="142" fill="#FFFFFF" stroke="#C4C2B6" stroke-width="1"/>
