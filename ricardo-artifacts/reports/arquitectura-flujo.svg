<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Archivo, Helvetica, Arial, sans-serif">
  <rect width="1180" height="620" fill="#f4f3ee"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#16160f">Un turno de consulta, de micrófono a parlante</text>
  <text x="28" y="62" font-size="12.5" fill="#4e4d45">Tiempos medidos el 24-oct-2026 en la A10G. Lo que está en azul es de Meta y lo ajustamos nosotros; lo verde es de Cartesia; lo rojo es Claude.</text>

  <!-- leyenda -->
  <g font-size="11.5" fill="#4e4d45">
    <rect x="28" y="80" width="12" height="12" fill="#1f6fd0"/><text x="46" y="90">Meta · corre en nuestra GPU · lo ajustamos</text>
    <rect x="300" y="80" width="12" height="12" fill="#1b9476"/><text x="318" y="90">Cartesia · nube · no se ajusta</text>
    <rect x="520" y="80" width="12" height="12" fill="#c8372f"/><text x="538" y="90">Claude · nube · decide y corrige</text>
    <rect x="740" y="80" width="12" height="12" fill="#86847a"/><text x="758" y="90">dispositivo del usuario</text>
  </g>

  <!-- entrada -->
  <g>
    <rect x="28" y="140" width="150" height="74" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="1.5"/>
    <text x="42" y="166" font-size="13.5" font-weight="600" fill="#16160f">Micrófono</text>
    <text x="42" y="186" font-size="11.5" fill="#4e4d45">iPhone, app nativa</text>
    <text x="42" y="203" font-size="11.5" fill="#4e4d45">16 kHz mono</text>
  </g>
  <path d="M178 177 H 228" stroke="#c4c2b6" stroke-width="2" marker-end="url(#f)"/>

  <!-- LID -->
  <g>
    <rect x="228" y="134" width="168" height="86" rx="3" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="228" y="134" width="168" height="5" fill="#1f6fd0"/>
    <text x="242" y="162" font-size="13.5" font-weight="600" fill="#16160f">mms-lid-512</text>
    <text x="242" y="181" font-size="11.5" fill="#4e4d45">¿quechua o castellano?</text>
    <text x="242" y="199" font-size="12" font-weight="700" fill="#1f6fd0">49 ms · 6/6 aciertos</text>
    <text x="242" y="214" font-size="10.5" fill="#86847a">no se ajusta: ya acierta</text>
  </g>

  <!-- bifurcacion -->
  <path d="M396 160 H 440 V 118 H 486" stroke="#1b9476" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M396 196 H 440 V 268 H 486" stroke="#1f6fd0" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="446" y="112" font-size="11" fill="#1b9476">castellano</text>
  <text x="446" y="288" font-size="11" fill="#1f6fd0">quechua</text>

  <!-- STT castellano -->
  <g>
    <rect x="486" y="86" width="196" height="76" rx="3" fill="#ffffff" stroke="#1b9476" stroke-width="2"/>
    <rect x="486" y="86" width="196" height="5" fill="#1b9476"/>
    <text x="500" y="114" font-size="13.5" font-weight="600" fill="#16160f">Cartesia ink-whisper</text>
    <text x="500" y="133" font-size="11.5" fill="#4e4d45">entiende a la enfermera</text>
    <text x="500" y="151" font-size="10.5" fill="#86847a">streaming · hay que decirle el idioma</text>
  </g>

  <!-- ASR quechua -->
  <g>
    <rect x="486" y="232" width="196" height="92" rx="3" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="486" y="232" width="196" height="5" fill="#1f6fd0"/>
    <text x="500" y="260" font-size="13.5" font-weight="600" fill="#16160f">omniASR_LLM_300M</text>
    <text x="500" y="279" font-size="11.5" fill="#4e4d45">entiende al paciente · quy_Latn</text>
    <text x="500" y="297" font-size="12" font-weight="700" fill="#1f6fd0">1.71 s · 3.41 GB de GPU</text>
    <text x="500" y="313" font-size="10.5" fill="#c8372f">ESTE es el que ajustamos</text>
  </g>

  <path d="M682 124 H 742 V 196 H 790" stroke="#c4c2b6" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <path d="M682 278 H 742 V 220 H 790" stroke="#c4c2b6" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <text x="690" y="252" font-size="10.5" fill="#86847a">N mejores</text>

  <!-- Claude -->
  <g>
    <rect x="790" y="150" width="200" height="118" rx="3" fill="#ffffff" stroke="#c8372f" stroke-width="2"/>
    <rect x="790" y="150" width="200" height="5" fill="#c8372f"/>
    <text x="804" y="178" font-size="13.5" font-weight="600" fill="#16160f">Claude</text>
    <text x="804" y="197" font-size="11.5" fill="#4e4d45">corrige las N mejores</text>
    <text x="804" y="214" font-size="11.5" fill="#4e4d45">traduce con glosario</text>
    <text x="804" y="231" font-size="11.5" fill="#4e4d45">retraduce y se audita</text>
    <text x="804" y="252" font-size="11" font-weight="700" fill="#c8372f">si cambió una dosis, no habla</text>
  </g>

  <!-- salidas -->
  <path d="M990 180 H 1030 V 118 H 1062" stroke="#1b9476" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <path d="M990 238 H 1030 V 300 H 1062" stroke="#1f6fd0" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <g>
    <rect x="1000" y="86" width="152" height="76" rx="3" fill="#ffffff" stroke="#1b9476" stroke-width="2"/>
    <rect x="1000" y="86" width="152" height="5" fill="#1b9476"/>
    <text x="1012" y="114" font-size="13" font-weight="600" fill="#16160f">Cartesia Sonic</text>
    <text x="1012" y="133" font-size="11.5" fill="#4e4d45">habla castellano</text>
    <text x="1012" y="151" font-size="10.5" fill="#86847a">44 idiomas · sin quechua</text>
  </g>
  <g>
    <rect x="1000" y="264" width="152" height="86" rx="3" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="1000" y="264" width="152" height="5" fill="#1f6fd0"/>
    <text x="1012" y="292" font-size="13" font-weight="600" fill="#16160f">mms-tts-quy</text>
    <text x="1012" y="311" font-size="11.5" fill="#4e4d45">habla chanka</text>
    <text x="1012" y="329" font-size="10.5" fill="#c8372f">lo ajustamos con la voz</text>
    <text x="1012" y="344" font-size="10.5" fill="#c8372f">de la mamá de Freddy</text>
  </g>

  <!-- presupuesto de espera -->
  <rect x="28" y="392" width="1124" height="94" rx="3" fill="#ffffff" stroke="#c4c2b6"/>
  <text x="44" y="418" font-size="14" font-weight="700" fill="#16160f">Presupuesto de espera por turno</text>
  <g font-size="12" fill="#4e4d45">
    <text x="44" y="442">detectar idioma</text><text x="190" y="442" font-weight="700" fill="#1f6fd0">49 ms</text>
    <text x="250" y="442">+ entender quechua</text><text x="400" y="442" font-weight="700" fill="#1f6fd0">1.71 s</text>
    <text x="460" y="442">+ Claude</text><text x="560" y="442" font-weight="700" fill="#c8372f">por medir</text>
    <text x="660" y="442">+ hablar</text><text x="740" y="442" font-weight="700" fill="#1b9476">por medir</text>
  </g>
  <text x="44" y="468" font-size="11.5" fill="#86847a">Con 49 ms, detectar el idioma ANTES de reconocer no cuesta nada: la vía en serie alcanza y no hace falta correr los dos reconocedores en paralelo.</text>

  <!-- caso mezcla -->
  <rect x="28" y="506" width="1124" height="86" rx="3" fill="#ffffff" stroke="#c8372f" stroke-width="1.5"/>
  <text x="44" y="532" font-size="14" font-weight="700" fill="#c8372f">El caso que no tiene respuesta correcta</text>
  <text x="44" y="554" font-size="12" fill="#4e4d45">«Mamáy, tome una pastilla cada ocho horas» es castellano con quechua adentro, y es como se habla en la posta. mms-lid lo llama castellano en los tres casos.</text>
  <text x="44" y="574" font-size="12" fill="#4e4d45">No se cuenta ni como acierto ni como error. Se reporta aparte, y lo resuelve la alternancia de turnos: si el turno anterior fue de la enfermera, este es del paciente.</text>

  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c4c2b6"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1b9476"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1f6fd0"/></marker>
  </defs>
</svg>
