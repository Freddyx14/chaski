<text x="812" y="177.0" font-size="11.0" fill="#4E4D45" font-weight="700">Claude</text>
<text x="812" y="208.9" font-size="11.0" fill="#4E4D45">Traduce y audita</text>
<text x="812" y="224.8" font-size="11.0" fill="#4E4D45">sonnet-5 traduce · haiku-4-5</text>
<text x="812" y="240.8" font-size="11.0" fill="#4E4D45">extrae hechos</text>
<text x="812" y="256.8" font-size="11.0" fill="#4E4D45">7–12 s: el cuello de botella</text>
<text x="812" y="272.7" font-size="11.0" fill="#4E4D45">Glosario cacheado en el system</text>
