<text x="52" y="499.0" font-size="11.0" fill="#4E4D45" font-weight="700">Por qué Cartesia no puede hacer el lado quechua</text>
<text x="52" y="530.9" font-size="11.0" fill="#4E4D45">Verificado en su documentación el 24-oct: Sonic 3.6 habla 44 idiomas y el quechua no está entre ellos.</text>
<text x="52" y="546.9" font-size="11.0" fill="#4E4D45">Su STT acepta un parámetro `language` en ISO-639-1 con `en` por defecto, y no detecta el idioma solo.</text>
<text x="52" y="562.8" font-size="11.0" fill="#4E4D45">Así que el quechua y la detección son nuestros por necesidad, no por preferencia.</text>
<text x="52" y="594.7" font-size="11.0" fill="#4E4D45">Y esos 49 ms del detector deciden la arquitectura: siendo tan barato, se detecta primero y se reconoce</text>
<text x="52" y="610.6" font-size="11.0" fill="#4E4D45">después, en serie. No hace falta correr los dos reconocedores en paralelo ni adivinar por el turno anterior.</text>
