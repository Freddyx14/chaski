<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Archivo, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#86847a"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a4fbd"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8b5a8"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#f4f3ee"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#16160f">Dónde corre cada cosa</text>
  <text x="28" y="62" font-size="12.5" fill="#4e4d45">Arquitectura de despliegue al 24-oct-2026, 18:00 UTC. Desde este día la laptop de Ricardo ya no está en la cadena: todo vive en la instancia.</text>

  <g font-size="11.5" fill="#4e4d45">
    <rect x="28" y="80" width="12" height="12" fill="#8a4fbd"/><text x="46" y="90">dentro de la instancia · sin salir a internet</text>
    <rect x="330" y="80" width="12" height="12" fill="#86847a"/><text x="348" y="90">por internet</text>
    <rect x="500" y="80" width="12" height="12" fill="#c8372f"/><text x="518" y="90">nube de terceros · se paga por llamada</text>
  </g>

  <!-- clientes -->
  <g>
    <rect x="28" y="150" width="168" height="66" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="1.5"/>
    <text x="42" y="174" font-size="13" font-weight="600" fill="#16160f">App de Freddy</text>
    <text x="42" y="193" font-size="11.5" fill="#4e4d45">iOS · consume la URL</text>
    <text x="42" y="209" font-size="10.5" fill="#86847a">no cambió nada el 24-oct</text>
  </g>
  <g>
    <rect x="28" y="236" width="168" height="60" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="1.5"/>
    <text x="42" y="260" font-size="13" font-weight="600" fill="#16160f">Navegador</text>
    <text x="42" y="279" font-size="11.5" fill="#4e4d45">GET /flujo · demo</text>
  </g>
  <g>
    <rect x="28" y="316" width="168" height="76" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="42" y="340" font-size="13" font-weight="600" fill="#16160f">Etiquetador</text>
    <text x="42" y="359" font-size="11.5" fill="#4e4d45">/corregir · laptop</text>
    <text x="42" y="376" font-size="10.5" fill="#86847a">túnel SSH aparte, solo Ricardo</text>
  </g>

  <path d="M196 183 H 246" stroke="#86847a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M196 266 H 230 V 200 H 246" stroke="#86847a" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ngrok edge -->
  <g>
    <rect x="246" y="150" width="186" height="104" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="2"/>
    <rect x="246" y="150" width="186" height="5" fill="#86847a"/>
    <text x="260" y="178" font-size="13" font-weight="600" fill="#16160f">ngrok · borde HTTPS</text>
    <text x="260" y="197" font-size="10.5" fill="#4e4d45">unsubmitted-wally-</text>
    <text x="260" y="211" font-size="10.5" fill="#4e4d45">relatable.ngrok-free.dev</text>
    <text x="260" y="231" font-size="11" font-weight="700" fill="#16160f">dominio reservado</text>
    <text x="260" y="246" font-size="10.5" fill="#86847a">no cambia entre reinicios</text>
  </g>
  <path d="M432 202 H 492" stroke="#86847a" stroke-width="2" marker-end="url(#a)"/>

  <!-- instancia -->
  <rect x="492" y="120" width="420" height="500" rx="4" fill="#faf9f5" stroke="#8a4fbd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="146" font-size="13.5" font-weight="700" fill="#8a4fbd">instancia g5.xlarge · 44.220.107.99</text>
  <text x="510" y="163" font-size="11" fill="#4e4d45">NVIDIA A10G 23 GB · el agente de ngrok corre aquí dentro</text>

  <!-- orquestador -->
  <g>
    <rect x="512" y="182" width="380" height="118" rx="3" fill="#ffffff" stroke="#8a4fbd" stroke-width="2"/>
    <rect x="512" y="182" width="380" height="5" fill="#8a4fbd"/>
    <text x="526" y="210" font-size="13.5" font-weight="600" fill="#16160f">Orquestador · puerto 8080</text>
    <text x="526" y="229" font-size="11.5" fill="#4e4d45">servicio/app.py · FastAPI · venv propio</text>
    <text x="526" y="247" font-size="11.5" fill="#4e4d45">/turno/paciente · /turno/enfermera · /ver · /escuchar</text>
    <text x="526" y="266" font-size="10.5" fill="#86847a">fastapi · anthropic · httpx · python-multipart</text>
    <text x="526" y="286" font-size="11" font-weight="700" fill="#8a4fbd">venv SEPARADO del de los modelos, a propósito</text>
  </g>

  <path d="M702 300 V 348" stroke="#8a4fbd" stroke-width="2.5" marker-end="url(#v)"/>
  <text x="712" y="320" font-size="11.5" font-weight="700" fill="#8a4fbd">127.0.0.1</text>
  <text x="712" y="336" font-size="10.5" fill="#4e4d45">no sale a internet</text>

  <!-- voz -->
  <g>
    <rect x="512" y="348" width="380" height="126" rx="3" fill="#ffffff" stroke="#1f6fd0" stroke-width="2"/>
    <rect x="512" y="348" width="380" height="5" fill="#1f6fd0"/>
    <text x="526" y="376" font-size="13.5" font-weight="600" fill="#16160f">Servicio de voz · puerto 8000</text>
    <text x="526" y="395" font-size="11.5" fill="#4e4d45">instancia.py · los tres modelos de Meta en GPU</text>
    <text x="526" y="414" font-size="11.5" fill="#4e4d45">omniASR_LLM_300M · mms-lid-512 · mms-tts-quy</text>
    <text x="526" y="433" font-size="10.5" fill="#86847a">torch==2.8.0 · fairseq2 · numpy~=1.23 · clavados</text>
    <text x="526" y="453" font-size="11" font-weight="700" fill="#c8372f">un pip install encima lo rompe. Ya pasó una vez.</text>
    <text x="526" y="468" font-size="10.5" fill="#86847a">pico 3.41 GB de 23 · LID 49 ms · ASR 1.71 s / 15.8 s</text>
  </g>

  <!-- volumenes -->
  <g>
    <rect x="512" y="498" width="184" height="100" rx="3" fill="#ffffff" stroke="#86847a" stroke-width="1.5"/>
    <text x="526" y="522" font-size="12.5" font-weight="600" fill="#16160f">/ · 145 GB</text>
    <text x="526" y="540" font-size="11" fill="#c8372f">90 % lleno · 15 GB libres</text>
    <text x="526" y="558" font-size="10.5" fill="#4e4d45">sistema. No poner nada</text>
    <text x="526" y="574" font-size="10.5" fill="#4e4d45">nuevo aquí.</text>
    <text x="526" y="590" font-size="10.5" fill="#86847a">persiste al parar la instancia</text>
  </g>
  <g>
    <rect x="708" y="498" width="184" height="100" rx="3" fill="#ffffff" stroke="#1b9476" stroke-width="1.5"/>
    <text x="722" y="522" font-size="12.5" font-weight="600" fill="#16160f">/opt/dlami/nvme</text>
    <text x="722" y="540" font-size="11" font-weight="700" fill="#1b9476">229 GB · 9 % usado</text>
    <text x="722" y="558" font-size="10.5" fill="#4e4d45">chaski/ · pesos · venvs</text>
    <text x="722" y="574" font-size="10.5" fill="#c8372f">efímero: se borra al parar</text>
    <text x="722" y="590" font-size="10.5" fill="#86847a">respaldo en ~/chaski-respaldo</text>
  </g>

  <!-- nubes -->
  <g>
    <rect x="952" y="182" width="200" height="106" rx="3" fill="#ffffff" stroke="#c8372f" stroke-width="2"/>
    <rect x="952" y="182" width="200" height="5" fill="#c8372f"/>
    <text x="966" y="210" font-size="13" font-weight="600" fill="#16160f">API de Anthropic</text>
    <text x="966" y="229" font-size="11.5" fill="#4e4d45">traducir · auditar · ver</text>
    <text x="966" y="247" font-size="11.5" fill="#4e4d45">sonnet-5 · haiku-4-5</text>
    <text x="966" y="267" font-size="11" font-weight="700" fill="#c8372f">7–12 s por turno</text>
    <text x="966" y="282" font-size="10.5" fill="#86847a">el cuello de botella real</text>
  </g>
  <g>
    <rect x="952" y="310" width="200" height="94" rx="3" fill="#ffffff" stroke="#1b9476" stroke-width="2"/>
    <rect x="952" y="310" width="200" height="5" fill="#1b9476"/>
    <text x="966" y="338" font-size="13" font-weight="600" fill="#16160f">API de Cartesia</text>
    <text x="966" y="357" font-size="11.5" fill="#4e4d45">Sonic 3.6 · habla castellano</text>
    <text x="966" y="375" font-size="11.5" fill="#4e4d45">ink-whisper · lo entiende</text>
    <text x="966" y="394" font-size="10.5" fill="#86847a">sin quechua: por eso es nuestro</text>
  </g>
  <path d="M892 230 H 952" stroke="#b8b5a8" stroke-width="2" marker-end="url(#c)"/>
  <path d="M892 262 H 922 V 350 H 952" stroke="#b8b5a8" stroke-width="2" fill="none" marker-end="url(#c)"/>

  <text x="952" y="446" font-size="12.5" font-weight="700" fill="#16160f">Lo que cambió</text>
  <text x="952" y="466" font-size="11" fill="#4e4d45">Antes: app → ngrok → laptop</text>
  <text x="952" y="482" font-size="11" fill="#4e4d45">de Ricardo → túnel SSH →</text>
  <text x="952" y="498" font-size="11" fill="#4e4d45">instancia → y todo de vuelta.</text>
  <text x="952" y="520" font-size="11" fill="#4e4d45">Si cerraba la laptop, se caía.</text>
  <text x="952" y="546" font-size="11" font-weight="700" fill="#8a4fbd">Ahora el audio no sale de</text>
  <text x="952" y="562" font-size="11" font-weight="700" fill="#8a4fbd">la instancia.</text>
  <text x="952" y="586" font-size="10.5" fill="#86847a">La URL es la misma. Freddy</text>
  <text x="952" y="600" font-size="10.5" fill="#86847a">no cambia una línea.</text>

  <text x="28" y="660" font-size="11" fill="#86847a">Se despliega con `bash servicio/desplegar.sh`, que es re-ejecutable. Las claves viajan por stdin a $DESTINO/.env con chmod 600; nunca por git.</text>
  <text x="28" y="678" font-size="11" fill="#86847a">El etiquetador sigue en la laptop porque lee audio local; abre su propio túnel SSH al 8000 de la instancia cuando lo necesita.</text>
</svg>
