<text x="1060" y="452.9" font-size="11.0" fill="#4E4D45">Sonic 3.6 · habla castellano</text>
<text x="1060" y="468.9" font-size="11.0" fill="#4E4D45">ink-whisper · lo entiende</text>
<text x="1060" y="500.8" font-size="11.0" fill="#4E4D45">Sin quechua: por eso el quechua es</text>
