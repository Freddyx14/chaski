<text x="1060" y="276.9" font-size="11.0" fill="#4E4D45">traducir · auditar · leer cajas</text>
<text x="1060" y="292.9" font-size="11.0" fill="#4E4D45">sonnet-5 · haiku-4-5</text>
<text x="1060" y="324.8" font-size="11.0" fill="#4E4D45">7–12 s por turno: el cuello de</text>
