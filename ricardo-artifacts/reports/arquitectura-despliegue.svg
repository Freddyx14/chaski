<text x="588" y="500.8" font-size="11.0" fill="#4E4D45">Un pip install encima lo rompe. Ya pasó una vez.</text>
<text x="588" y="516.7" font-size="11.0" fill="#4E4D45">LID 49 ms · ASR 1.71 s para 15.8 s · pico 3.41 GB de 23</text>
