<text x="52" y="431.0" font-size="11.0" fill="#4E4D45" font-weight="700">Lo que cambió hoy</text>
<text x="52" y="462.9" font-size="11.0" fill="#4E4D45">Antes: app → ngrok → laptop de Ricardo → túnel SSH →</text>
<text x="52" y="478.9" font-size="11.0" fill="#4E4D45">instancia, y todo de vuelta por el mismo camino.</text>
<text x="52" y="494.8" font-size="11.0" fill="#4E4D45">Si cerraba la laptop, se caía.</text>
<text x="52" y="526.7" font-size="11.0" fill="#4E4D45">Ahora el audio del paciente no sale de la instancia.</text>
<text x="52" y="542.6" font-size="11.0" fill="#4E4D45">La URL es la misma: Freddy no cambia una línea.</text>
<text x="52" y="574.5" font-size="11.0" fill="#4E4D45">Se despliega con `bash servicio/desplegar.sh`, re-ejecutable.</text>
<text x="52" y="590.5" font-size="11.0" fill="#4E4D45">Las claves viajan por stdin a .env con chmod 600; nunca por git.</text>
