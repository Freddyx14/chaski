<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="1500" height="950" font-family="Archivo, Helvetica, Arial, sans-serif">
<defs><marker id="m8C8C7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C8C7A"/></marker><marker id="mC8C5B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C8C5B8"/></marker></defs>
<rect width="1500" height="950" fill="#F4F3EE"/>
<text x="40" y="46.8" font-size="19.0" fill="#16160F" font-weight="700">From a family's voice to a number we can defend</text>
<text x="40" y="66.8" font-size="12.0" fill="#4E4D45">Data architecture. The one rule everything rests on: the test speaker never enters training.</text>
<text x="40" y="112.2" font-size="13.0" fill="#16160F" font-weight="700">1 · Collection</text>
<rect x="40" y="118" width="220" height="108" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="40" y="118" width="220" height="4" fill="#8C8C7A"/>
<image href="data:image/svg+xml;base64," x="50" y="128" width="26" height="26"/>
<text x="82" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">Printed booklets</text>
<text x="82" y="166.9" font-size="11.0" fill="#4E4D45">175 numbered sentences</text>
<text x="82" y="182.8" font-size="11.0" fill="#4E4D45">six blocks: A B C M N E</text>
<text x="82" y="198.8" font-size="11.0" fill="#4E4D45">Written first, recorded</text>
<text x="82" y="214.8" font-size="11.0" fill="#4E4D45">after</text>
<rect x="290" y="118" width="220" height="108" fill="#FFFFFF" stroke="#1B9476" stroke-width="2"/>
<rect x="290" y="118" width="220" height="4" fill="#1B9476"/>
<image href="data:image/svg+xml;base64," x="300" y="128" width="26" height="26"/>
<text x="332" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">Web form (Freddy)</text>
<text x="332" y="166.9" font-size="11.0" fill="#4E4D45">Vercel · families upload</text>
<text x="332" y="182.8" font-size="11.0" fill="#4E4D45">audio</text>
<text x="332" y="198.8" font-size="11.0" fill="#4E4D45">and how it is spelled</text>
<text x="332" y="214.8" font-size="11.0" fill="#4E4D45">Not touched from this side</text>
<rect x="540" y="118" width="230" height="108" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="540" y="118" width="230" height="4" fill="#1F6FD0"/>
<image href="data:image/svg+xml;base64," x="550" y="128" width="26" height="26"/>
<text x="582" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">/corregir (Ricardo)</text>
<text x="582" y="166.9" font-size="11.0" fill="#4E4D45">Transcribes, a human fixes the</text>
<text x="582" y="182.8" font-size="11.0" fill="#4E4D45">text</text>
<text x="582" y="198.8" font-size="11.0" fill="#4E4D45">Splits and joins bad cuts</text>
<text x="582" y="214.8" font-size="11.0" fill="#4E4D45">Checks audio against text</text>
<rect x="800" y="118" width="240" height="96" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="800" y="118" width="240" height="4" fill="#8C8C7A"/>
<image href="data:image/svg+xml;base64," x="810" y="128" width="26" height="26"/>
<text x="842" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">manifiesto.jsonl</text>
<text x="842" y="166.9" font-size="11.0" fill="#4E4D45">speaker · block · number</text>
<text x="842" y="182.8" font-size="11.0" fill="#4E4D45">audio · transcript · Spanish</text>
<text x="842" y="198.8" font-size="11.0" fill="#4E4D45">seconds · consent</text>
<text x="40" y="260.2" font-size="13.0" fill="#16160F" font-weight="700">2 · Split BY SPEAKER, never by sentence</text>
<rect x="40" y="266" width="230" height="76" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="40" y="266" width="230" height="4" fill="#1F6FD0"/>
<text x="50" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">train</text>
<text x="50" y="314.9" font-size="11.0" fill="#4E4D45">3 speakers · ~22 min</text>
<text x="50" y="330.9" font-size="11.0" fill="#4E4D45">Fits the adapter</text>
<rect x="300" y="266" width="220" height="76" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="300" y="266" width="220" height="4" fill="#8C8C7A"/>
<text x="310" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">validation</text>
<text x="310" y="314.9" font-size="11.0" fill="#4E4D45">12 % of train</text>
<text x="310" y="330.9" font-size="11.0" fill="#4E4D45">Picks hyperparameters</text>
<rect x="550" y="266" width="300" height="76" fill="#FFFFFF" stroke="#C8372F" stroke-width="3"/>
<rect x="550" y="266" width="300" height="4" fill="#C8372F"/>
<text x="560" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">test · one whole speaker</text>
<text x="560" y="314.9" font-size="11.0" fill="#4E4D45">A voice the model NEVER heard</text>
<text x="560" y="330.9" font-size="11.0" fill="#4E4D45">Touched once, at the end</text>
<text x="40" y="388.2" font-size="13.0" fill="#16160F" font-weight="700">3 · Three steps, three numbers — all three reported, whatever they say</text>
<rect x="40" y="394" width="250" height="70" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="40" y="394" width="250" height="4" fill="#8C8C7A"/>
<text x="50" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">0 · The model as shipped</text>
<text x="50" y="442.9" font-size="11.0" fill="#4E4D45">Baseline. Nothing touched.</text>
<rect x="320" y="394" width="250" height="70" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="320" y="394" width="250" height="4" fill="#1F6FD0"/>
<text x="330" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">1 · + clinic vocabulary</text>
<text x="330" y="442.9" font-size="11.0" fill="#4E4D45">Glossary and loanwords</text>
<rect x="600" y="394" width="250" height="92" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="3"/>
<rect x="600" y="394" width="250" height="4" fill="#1F6FD0"/>
<text x="610" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">2 · + fine-tuning on the voices</text>
<text x="610" y="442.9" font-size="11.0" fill="#4E4D45">ASR 30 epochs: 14 min</text>
<text x="610" y="458.9" font-size="11.0" fill="#4E4D45">TTS 50 epochs: 20 min</text>
<text x="610" y="474.8" font-size="11.0" fill="#4E4D45">measured on the A10G</text>
<text x="40" y="514.2" font-size="13.0" fill="#16160F" font-weight="700">4 · Each thing is measured against its own ground truth</text>
<text x="40" y="532.0" font-size="11.0" fill="#4E4D45">Until Oct 24 the audit had none: it only compared against Freddy's, which proves nothing if both are wrong the same way.</text>
<rect x="40" y="542" width="300" height="100" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="40" y="542" width="300" height="4" fill="#1F6FD0"/>
<image href="data:image/svg+xml;base64," x="50" y="552" width="26" height="26"/>
<text x="82" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_asr.py — understanding</text>
<text x="82" y="590.9" font-size="11.0" fill="#4E4D45">Truth: the text corrected in /corregir</text>
<text x="82" y="606.9" font-size="11.0" fill="#4E4D45">WER and CER · speaker-held-out</text>
<text x="82" y="622.8" font-size="11.0" fill="#4E4D45">Scored apart: loanwords and numbers</text>
<rect x="370" y="542" width="320" height="108" fill="#FFFFFF" stroke="#C8372F" stroke-width="2"/>
<rect x="370" y="542" width="320" height="4" fill="#C8372F"/>
<image href="data:image/svg+xml;base64," x="380" y="552" width="26" height="26"/>
<text x="412" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_traduccion.py — translation</text>
<text x="412" y="590.9" font-size="11.0" fill="#4E4D45">Truth: 62 pairs the families wrote on</text>
<text x="412" y="606.9" font-size="11.0" fill="#4E4D45">hackathon day</text>
<text x="412" y="622.8" font-size="11.0" fill="#4E4D45">chrF++, not BLEU: Quechua is agglutinative</text>
<text x="412" y="638.8" font-size="11.0" fill="#4E4D45">Sonnet 5 44.6 · NLLB-1.3B 34.7 · 600M 28.6</text>
<rect x="720" y="542" width="330" height="100" fill="#FFFFFF" stroke="#8A4FBD" stroke-width="3"/>
<rect x="720" y="542" width="330" height="4" fill="#8A4FBD"/>
<image href="data:image/svg+xml;base64," x="730" y="552" width="26" height="26"/>
<text x="762" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_guarda.py — catching errors</text>
<text x="762" y="590.9" font-size="11.0" fill="#4E4D45">Truth: a clinical error is injected on purpose</text>
<text x="762" y="606.9" font-size="11.0" fill="#4E4D45">Changed dose · dropped negation · condition</text>
<text x="762" y="622.8" font-size="11.0" fill="#4E4D45">183/184 caught · 100 % of the critical ones</text>
<rect x="1080" y="542" width="300" height="100" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="1080" y="542" width="300" height="4" fill="#8C8C7A"/>
<image href="data:image/svg+xml;base64," x="1090" y="552" width="26" height="26"/>
<text x="1122" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_auditoria.py — stability</text>
<text x="1122" y="590.9" font-size="11.0" fill="#4E4D45">Same sentence, several runs</text>
<text x="1122" y="606.9" font-size="11.0" fill="#4E4D45">Blocked · stability · median</text>
<text x="1122" y="622.8" font-size="11.0" fill="#4E4D45">The 4-call variant gives: yes, no, yes</text>
<rect x="370" y="676" width="320" height="76" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="370" y="676" width="320" height="4" fill="#8C8C7A"/>
<image href="data:image/svg+xml;base64," x="380" y="686" width="26" height="26"/>
<text x="412" y="693.0" font-size="11.0" fill="#4E4D45" font-weight="700">reports/*.json</text>
<text x="412" y="724.9" font-size="11.0" fill="#4E4D45">asr · lid · translation · guard · audit</text>
<text x="412" y="740.9" font-size="11.0" fill="#4E4D45">One file per number</text>
<rect x="720" y="676" width="330" height="76" fill="#FFFFFF" stroke="#C8372F" stroke-width="2"/>
<rect x="720" y="676" width="330" height="4" fill="#C8372F"/>
<text x="730" y="693.0" font-size="11.0" fill="#4E4D45" font-weight="700">The page and the pitch</text>
<text x="730" y="724.9" font-size="11.0" fill="#4E4D45">Read those JSON files and nothing else.</text>
<text x="730" y="740.9" font-size="11.0" fill="#4E4D45">A bad number is shown anyway.</text>
<rect x="40" y="786" width="1340" height="126" fill="#FFFFFF" stroke="#C4C2B6" stroke-width="1"/>
<rect x="40" y="786" width="1340" height="4" fill="#C4C2B6"/>
<text x="52" y="805.0" font-size="11.0" fill="#4E4D45" font-weight="700">What we fine-tune, and what we leave alone</text>
<text x="52" y="836.9" font-size="11.0" fill="#4E4D45">Two Meta models are fine-tuned: MMS-1B-all (understanding Chanka) and mms-tts-quy (speaking it).</text>
<text x="52" y="852.9" font-size="11.0" fill="#4E4D45">mms-lid is used as shipped. Cartesia and Claude are not fine-tuned at all.</text>
<text x="52" y="884.8" font-size="11.0" fill="#4E4D45">They are two different jobs: understanding wants MANY voices; speaking wants ONE consistent voice,</text>
<text x="52" y="900.7" font-size="11.0" fill="#4E4D45">Freddy’s mother. That is why everyone records, but Chaski speaks with a single person’s voice.</text>
