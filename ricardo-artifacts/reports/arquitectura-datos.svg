<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="1500" height="950" font-family="Archivo, Helvetica, Arial, sans-serif">
<defs><marker id="m8C8C7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8C8C7A"/></marker><marker id="mC8C5B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C8C5B8"/></marker></defs>
<rect width="1500" height="950" fill="#F4F3EE"/>
<text x="40" y="46.8" font-size="19.0" fill="#16160F" font-weight="700">De la voz de la familia al número del pitch</text>
<text x="40" y="66.8" font-size="12.0" fill="#4E4D45">Arquitectura de datos. La regla que sostiene todo: la voz de prueba nunca entra al entrenamiento.</text>
<text x="40" y="112.2" font-size="13.0" fill="#16160F" font-weight="700">1 · Recolección</text>
<rect x="40" y="118" width="220" height="108" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="40" y="118" width="220" height="4" fill="#8C8C7A"/>
<text x="50" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">Cuadernillos</text>
<text x="50" y="166.9" font-size="11.0" fill="#4E4D45">175 frases numeradas</text>
<text x="50" y="182.8" font-size="11.0" fill="#4E4D45">seis bloques: A B C M N E</text>
<text x="50" y="198.8" font-size="11.0" fill="#4E4D45">Se escribe primero, se graba</text>
<text x="50" y="214.8" font-size="11.0" fill="#4E4D45">después</text>
<rect x="290" y="118" width="220" height="96" fill="#FFFFFF" stroke="#1B9476" stroke-width="2"/>
<rect x="290" y="118" width="220" height="4" fill="#1B9476"/>
<text x="300" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">Formulario (Freddy)</text>
<text x="300" y="166.9" font-size="11.0" fill="#4E4D45">Vercel · la familia sube audio</text>
<text x="300" y="182.8" font-size="11.0" fill="#4E4D45">y cómo se escribe</text>
<text x="300" y="198.8" font-size="11.0" fill="#4E4D45">No lo tocamos desde aquí</text>
<rect x="540" y="118" width="230" height="96" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="540" y="118" width="230" height="4" fill="#1F6FD0"/>
<text x="550" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">/corregir (Ricardo)</text>
<text x="550" y="166.9" font-size="11.0" fill="#4E4D45">Transcribe, yo corrijo el escrito</text>
<text x="550" y="182.8" font-size="11.0" fill="#4E4D45">Parte y une si cortó mal</text>
<text x="550" y="198.8" font-size="11.0" fill="#4E4D45">Verifica audio contra texto</text>
<rect x="800" y="118" width="240" height="96" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="800" y="118" width="240" height="4" fill="#8C8C7A"/>
<text x="810" y="135.0" font-size="11.0" fill="#4E4D45" font-weight="700">manifiesto.jsonl</text>
<text x="810" y="166.9" font-size="11.0" fill="#4E4D45">persona · bloque · numero</text>
<text x="810" y="182.8" font-size="11.0" fill="#4E4D45">audio · transcripcion · castellano</text>
<text x="810" y="198.8" font-size="11.0" fill="#4E4D45">segundos · consentimiento</text>
<text x="40" y="260.2" font-size="13.0" fill="#16160F" font-weight="700">2 · Partición POR HABLANTE, nunca por frase</text>
<rect x="40" y="266" width="230" height="76" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="40" y="266" width="230" height="4" fill="#1F6FD0"/>
<text x="50" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">entrenamiento</text>
<text x="50" y="314.9" font-size="11.0" fill="#4E4D45">3 personas · ~22 min</text>
<text x="50" y="330.9" font-size="11.0" fill="#4E4D45">Ajusta el modelo</text>
<rect x="300" y="266" width="220" height="76" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="300" y="266" width="220" height="4" fill="#8C8C7A"/>
<text x="310" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">validación</text>
<text x="310" y="314.9" font-size="11.0" fill="#4E4D45">12 % del entrenamiento</text>
<text x="310" y="330.9" font-size="11.0" fill="#4E4D45">Elige hiperparámetros</text>
<rect x="550" y="266" width="300" height="76" fill="#FFFFFF" stroke="#C8372F" stroke-width="3"/>
<rect x="550" y="266" width="300" height="4" fill="#C8372F"/>
<text x="560" y="283.0" font-size="11.0" fill="#4E4D45" font-weight="700">prueba · una persona entera</text>
<text x="560" y="314.9" font-size="11.0" fill="#4E4D45">Voz que el modelo NUNCA escuchó</text>
<text x="560" y="330.9" font-size="11.0" fill="#4E4D45">Se toca una sola vez, al final</text>
<text x="40" y="388.2" font-size="13.0" fill="#16160F" font-weight="700">3 · Tres pasos, tres números — se reportan los tres salga lo que salga</text>
<rect x="40" y="394" width="250" height="70" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="40" y="394" width="250" height="4" fill="#8C8C7A"/>
<text x="50" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">0 · El modelo tal cual</text>
<text x="50" y="442.9" font-size="11.0" fill="#4E4D45">Línea base. Sin tocar nada.</text>
<rect x="320" y="394" width="250" height="70" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="320" y="394" width="250" height="4" fill="#1F6FD0"/>
<text x="330" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">1 · + vocabulario de la posta</text>
<text x="330" y="442.9" font-size="11.0" fill="#4E4D45">Glosario y préstamos</text>
<rect x="600" y="394" width="250" height="70" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="3"/>
<rect x="600" y="394" width="250" height="4" fill="#1F6FD0"/>
<text x="610" y="411.0" font-size="11.0" fill="#4E4D45" font-weight="700">2 · + ajuste fino con las voces</text>
<text x="610" y="442.9" font-size="11.0" fill="#4E4D45">~7 min en la A10G</text>
<text x="40" y="514.2" font-size="13.0" fill="#16160F" font-weight="700">4 · Cada cosa se mide contra una verdad distinta</text>
<text x="40" y="532.0" font-size="11.0" fill="#4E4D45">Hasta el 24-oct la auditoría no tenía ninguna: solo se comparaba con la de Freddy, y eso no prueba nada si las dos se equivocan igual.</text>
<rect x="40" y="542" width="300" height="100" fill="#FFFFFF" stroke="#1F6FD0" stroke-width="2"/>
<rect x="40" y="542" width="300" height="4" fill="#1F6FD0"/>
<text x="50" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_asr.py — entender</text>
<text x="50" y="590.9" font-size="11.0" fill="#4E4D45">Verdad: el escrito corregido en /corregir</text>
<text x="50" y="606.9" font-size="11.0" fill="#4E4D45">WER y CER · corte por hablante</text>
<text x="50" y="622.8" font-size="11.0" fill="#4E4D45">Aparte: préstamos y números</text>
<rect x="370" y="542" width="320" height="100" fill="#FFFFFF" stroke="#C8372F" stroke-width="2"/>
<rect x="370" y="542" width="320" height="4" fill="#C8372F"/>
<text x="380" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_traduccion.py — traducir</text>
<text x="380" y="590.9" font-size="11.0" fill="#4E4D45">Verdad: 100 pares verificados, fuera del train</text>
<text x="380" y="606.9" font-size="11.0" fill="#4E4D45">chrF++, no BLEU: el quechua aglutina</text>
<text x="380" y="622.8" font-size="11.0" fill="#4E4D45">Base sin ajustar: chrF++ 42.31</text>
<rect x="720" y="542" width="330" height="100" fill="#FFFFFF" stroke="#8A4FBD" stroke-width="3"/>
<rect x="720" y="542" width="330" height="4" fill="#8A4FBD"/>
<text x="730" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_guarda.py — no dejar pasar errores</text>
<text x="730" y="590.9" font-size="11.0" fill="#4E4D45">Verdad: se inyecta un error clínico a propósito</text>
<text x="730" y="606.9" font-size="11.0" fill="#4E4D45">Dosis cambiada · negación borrada · condición</text>
<text x="730" y="622.8" font-size="11.0" fill="#4E4D45">0/6 falsos bloqueos · 3/6 FUGAS</text>
<rect x="1080" y="542" width="300" height="100" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="1080" y="542" width="300" height="4" fill="#8C8C7A"/>
<text x="1090" y="559.0" font-size="11.0" fill="#4E4D45" font-weight="700">medir_auditoria.py — estabilidad</text>
<text x="1090" y="590.9" font-size="11.0" fill="#4E4D45">La misma frase, varias corridas</text>
<text x="1090" y="606.9" font-size="11.0" fill="#4E4D45">Bloqueo · estabilidad · mediana</text>
<text x="1090" y="622.8" font-size="11.0" fill="#4E4D45">La de 4 llamadas da: sí, no, sí</text>
<rect x="370" y="676" width="320" height="76" fill="#FFFFFF" stroke="#8C8C7A" stroke-width="2"/>
<rect x="370" y="676" width="320" height="4" fill="#8C8C7A"/>
<text x="380" y="693.0" font-size="11.0" fill="#4E4D45" font-weight="700">reports/*.json</text>
<text x="380" y="724.9" font-size="11.0" fill="#4E4D45">asr · lid · traduccion · guarda · auditoria</text>
<text x="380" y="740.9" font-size="11.0" fill="#4E4D45">Un archivo por número</text>
<rect x="720" y="676" width="330" height="76" fill="#FFFFFF" stroke="#C8372F" stroke-width="2"/>
<rect x="720" y="676" width="330" height="4" fill="#C8372F"/>
<text x="730" y="693.0" font-size="11.0" fill="#4E4D45" font-weight="700">La página y el pitch</text>
<text x="730" y="724.9" font-size="11.0" fill="#4E4D45">Leen esos JSON y nada más.</text>
<text x="730" y="740.9" font-size="11.0" fill="#4E4D45">Si un número sale malo, se muestra igual.</text>
<rect x="40" y="786" width="1340" height="126" fill="#FFFFFF" stroke="#C4C2B6" stroke-width="1"/>
<rect x="40" y="786" width="1340" height="4" fill="#C4C2B6"/>
<text x="52" y="805.0" font-size="11.0" fill="#4E4D45" font-weight="700">Qué se ajusta y qué no</text>
<text x="52" y="836.9" font-size="11.0" fill="#4E4D45">Se ajustan los dos modelos de Meta: omniASR (entender chanka) y mms-tts-quy (hablar chanka).</text>
<text x="52" y="852.9" font-size="11.0" fill="#4E4D45">mms-lid ya acierta 6/6 y se deja quieto. Cartesia y Claude no se ajustan: se usan como vienen.</text>
<text x="52" y="884.8" font-size="11.0" fill="#4E4D45">Y son dos ajustes distintos: entender quiere MUCHAS voces; hablar quiere UNA sola voz consistente,</text>
<text x="52" y="900.7" font-size="11.0" fill="#4E4D45">la de la mamá de Freddy. Por eso todos graban, pero la voz de Chaski sale de una sola persona.</text>
