[project]
name = "chaski"
version = "0.1.0"
description = "Health-post instructions in Chanka Quechua, with self-audit before sending. Cal Hacks 13.0."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
